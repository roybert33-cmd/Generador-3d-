        @import url('https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Instrument+Serif:ital@0;1&display=swap');
        :root{
          --bg:#fcfcfa;
          --fg:#1c1c1e;
          --mut:#6b6b70;
          --card:#f2f2f5;
          --card-2:#ededf0;
          --ac:#5b4bdb;
          --ac-2:#ede9ff;
          --bad:#c0392b;
          --ok:#1e8e4e;
          --line:#e9e9ec;
          --shadow: 0 8px 24px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.05);
        }
        @media (prefers-color-scheme:dark){
          :root{
            --bg:#17171a;
            --fg:#f0f0f3;
            --mut:#9a9aa2;
            --card:#26262b;
            --card-2:#2e2e34;
            --ac:#8f82ff;
            --ac-2:#2a2548;
            --bad:#ff7b6b;
            --ok:#4cd388;
            --line:#2f2f35;
            --shadow: 0 12px 32px rgba(0,0,0,0.35), 0 1px 2px rgba(0,0,0,0.4);
          }
        }
        *{box-sizing:border-box}
        html,body{margin:0;padding:0}
        body{background:var(--bg);color:var(--fg);font-family: ui-sans-system, system-ui, -apple-system, Segoe UI, sans-serif; -webkit-font-smoothing: antialiased;}
        .mono{font-family: "Fragment Mono", ui-monospace, SFMono-Regular, monospace;}
        .serif{font-family: "Instrument Serif", ui-serif, Georgia, serif;}
        .app-shell{
          min-height:100vh;
          min-height:100dvh;
          padding-top: var(--safe-area-inset-top);
          padding-bottom: var(--safe-area-inset-bottom);
          box-sizing:border-box;
          overflow-x: clip;
          background: radial-gradient(1200px 600px at 10% -10%, var(--ac-2) 0%, transparent 60%), var(--bg);
        }
        .wrap{max-width: 720px; margin:0 auto; padding: 20px 16px 40px;}
        .top{
          display:flex; justify-content:space-between; align-items:baseline; gap:16px; margin-bottom:18px;
        }
        .top h1{font-size: 2.1rem; line-height:0.95; letter-spacing:-0.02em; margin:0; font-weight:400;}
        .top p{margin:6px 0 0; color:var(--mut); font-size:0.92rem; max-width:36ch}
        .badge{
          display:inline-flex; align-items:center; gap:6px;
          background: var(--card); border:1px solid var(--line);
          padding:6px 10px; border-radius:999px; font-size:0.78rem; color:var(--mut);
        }
        .dot{width:7px;height:7px;border-radius:50%; background: var(--ok); box-shadow:0 0 0 4px color-mix(in srgb, var(--ok) 18%, transparent);}
        .grid{display:grid; grid-template-columns: 1fr; gap:12px;}
        @media(min-width:720px){ .grid{grid-template-columns: 1fr 1fr;} .grid .full{grid-column:1 / -1} }
        .card{
          background: var(--card);
          border:1px solid var(--line);
          border-radius: 18px;
          padding: 16px;
          box-shadow: var(--shadow);
          position:relative;
          overflow:hidden;
        }
        .card::before{
          content:""; position:absolute; inset:0 0 auto 0; height:1px;
          background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
          opacity:0.6; pointer-events:none;
        }
        .card h2{font-size:1.02rem; margin:0 0 8px; letter-spacing:-0.01em; display:flex; align-items:center; gap:8px}
        .card h2 .n{
          width:22px;height:22px;border-radius:50%; background: var(--fg); color: var(--bg);
          display:grid; place-items:center; font-size:0.75rem; font-family: "Fragment Mono", monospace;
        }
        .s{color:var(--mut); font-size:0.88rem; line-height:1.35; margin:0 0 10px}
        ol{margin:0; padding-left:18px; color:var(--mut); font-size:0.88rem; line-height:1.45}
        ol li{margin:4px 0}
        label.row{
          display:flex; justify-content:space-between; align-items:center; gap:10px; margin:8px 0; font-size:0.92rem
        }
        input[type=number], input[type=text]{
          padding:8px 10px; border-radius:10px; border:1px solid var(--line);
          background: var(--bg); color:var(--fg); font-size:0.95rem; outline:none; transition: border .15s, box-shadow .15s;
        }
        input[type=number]:focus, input[type=text]:focus{border-color: var(--ac); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ac) 18%, transparent);}
        input[type=number]{width:96px; font-family:"Fragment Mono", monospace}
        input[type=file]{
          width:100%; font-size:0.9rem; color:var(--mut);
          border:1px dashed var(--line); border-radius:12px; padding:12px; background: var(--bg);
        }
        input[type=file]::file-selector-button{
          border:0; background:var(--fg); color:var(--bg); padding:6px 12px; border-radius:8px; font-weight:600; margin-right:12px; cursor:pointer;
        }
        button{
          display:flex; align-items:center; justify-content:center; gap:8px;
          width:100%; padding:13px 16px; border:0; border-radius:12px;
          background:var(--ac); color:#fff; font-size:0.98rem; font-weight:650; cursor:pointer;
          transition: transform .08s, opacity .15s, background .15s, box-shadow .15s;
          box-shadow: 0 4px 16px color-mix(in srgb, var(--ac) 28%, transparent);
        }
        button:active{transform: translateY(1px) scale(0.99)}
        button:disabled{opacity:.45; cursor:not-allowed; transform:none; box-shadow:none}
        button.g{background: var(--card-2); color: var(--fg); box-shadow:none; border:1px solid var(--line)}
        button.g:hover{background: var(--bg)}
        .btns{display:flex; gap:8px; margin-top:10px}
        .btns button{padding:10px; font-size:0.88rem; border-radius:10px}
        #v3{width:100%; height:360px; border-radius:14px; background:#1d1d22; display:block; touch-action:none; border:1px solid var(--line)}
        .bad{color:var(--bad)} .ok{color:var(--ok)}
        .kpi{
          display:flex; gap:10px; flex-wrap:wrap; margin:10px 0 2px;
        }
        .kpi span{
          background:var(--bg); border:1px solid var(--line); border-radius:999px; padding:6px 10px; font-size:0.8rem;
          font-family:"Fragment Mono", monospace;
        }
        .log{
          white-space:pre-wrap; max-height:180px; overflow:auto; margin:8px 0 0;
          background: var(--bg); border:1px solid var(--line); border-radius:12px; padding:10px;
          font-family:"Fragment Mono", monospace; font-size:0.78rem; line-height:1.4; color:var(--mut);
        }
        .drop-active{outline: 2px solid var(--ac); outline-offset: 2px; border-color: var(--ac) !important}
        .hero-art{
          position:absolute; right:-20px; top:-20px; width:160px; height:160px; opacity:0.07; pointer-events:none;
          background: radial-gradient(circle at 50% 50%, var(--ac), transparent 70%);
          filter: blur(1px);
        }
        .dl{
          position:sticky; bottom:16px; z-index:5; margin-top:12px;
        }
        .dl button{
          background: var(--fg); color: var(--bg); box-shadow: 0 8px 24px rgba(0,0,0,0.18);
          font-size:1.02rem; padding:14px;
